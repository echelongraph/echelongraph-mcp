name: Release

# Publishes echelongraph-mcp to npm when a vX.Y.Z tag is pushed, through npm trusted
# publishing (OIDC): no npm token exists anywhere in this repository or its secrets.
# https://docs.npmjs.com/trusted-publishers
#
# Six jobs, so the ones that can mint a credential run no dependency code:
#   build    builds, tests, packs, and tests the PACKED TARBALL; uploads that tarball.
#   bundle   (#2815) builds the Claude Desktop extension, echelongraph-mcp.mcpb, from this tag with
#            listings/mcpb/build.sh, whose pinned MCPB CLI validates manifest.json before it packs,
#            and uploads it unchecked with its sha256. Read-only token.
#   check-bundle  (#2815) on a fresh runner that never ran the MCPB CLI, from a fresh checkout,
#            checks the bundle (listings/mcpb/check-bundle.mjs): it holds only what build.sh
#            stages; its package.json, LICENSE, README.md and dist/ are the tested tarball's; its
#            node_modules/ adds or changes nothing a production install from the lockfile has; and
#            its own server lists manifest.json's tools. Read-only token.
#   publish  holds id-token: write. Runs only once build AND check-bundle pass. Downloads the tested
#            tarball, checks it is byte for byte the one build tested, and publishes it with a
#            provenance attestation.
#   verify   reads the registry until it serves the version, and checks it serves the tested
#            tarball with a provenance attestation that `npm audit signatures` verifies, and that
#            names this workflow at this tag and this commit (.github/scripts/check-provenance.sh).
#   release-bundle  holds id-token, attestations and contents: write; checks out nothing and runs
#            no dependency code. After verify (or for a version npm already has), it signs the
#            checked bundle with a SLSA v1 build-provenance attestation (Sigstore, keyless: no key
#            or certificate exists anywhere), attaches it and its Sigstore bundle to the GitHub
#            release vX.Y.Z, creating the release if there is none, and checks with
#            `gh attestation verify` that the file the release serves is attested by this workflow
#            at this tag. README "Install in Claude Desktop" links releases/latest/download/ to it.
#
# npm versions are immutable and cannot be taken back, only superseded. Every check of what is
# released, the tarball (build) and the bundle (bundle, check-bundle), runs before the publish:
# a manifest or bundle defect stops the release with nothing published. What runs after the
# publish only reads what the registry and the GitHub release serve, and signs and attaches the
# bundle already checked.
#
# Critical path: build 20 + bundle 20 + check-bundle 15 + publish 15 + verify 30 + release-bundle
# 15 = 115 min of job timeouts, plus queueing (scripts/npm-publish-mcp.sh RUN_FINISH_POLLS).
#
# A tag whose version npm already has publishes nothing, and its run passes only if that version
# carries provenance from this workflow at this tag (see "Is the version on npm yet").

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: echelongraph-mcp
  REGISTRY: https://registry.npmjs.org

jobs:
  build:
    name: Build, test, and test the packed tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.name }}
      sha1: ${{ steps.pack.outputs.sha1 }}
      integrity: ${{ steps.pack.outputs.integrity }}
      already: ${{ steps.registry.outputs.already }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the on-main check below needs main's history
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false # never cache in a release build

      - name: The tag names the version in package.json, server.json and the lockfile
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH; this workflow publishes release versions only"; exit 1; }
          VERSION="${TAG#v}"
          # shellcheck disable=SC2016 # ${...} below is a JavaScript template literal
          node -e '
            const [want, name] = process.argv.slice(1);
            const pkg = require("./package.json"), sj = require("./server.json"), lock = require("./package-lock.json");
            const seen = {
              "package.json name": [pkg.name, name],
              "package.json version": [pkg.version, want],
              "server.json version": [sj.version, want],
              "server.json packages[0].version": [sj.packages?.[0]?.version, want],
              "package-lock.json version": [lock.version, want],
              "package-lock.json packages[\"\"].version": [lock.packages?.[""]?.version, want],
            };
            let bad = 0;
            for (const [where, [got, exp]] of Object.entries(seen)) {
              if (got === exp) console.log(`${where} = ${got}`);
              else { console.log(`::error::${where} is ${got}; the tag says ${exp}`); bad++; }
            }
            process.exit(bad ? 1 : 0);
          ' "$VERSION" "$PACKAGE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_SHA is not on main. Release from a commit that main contains."; exit 1; }
          echo "$GITHUB_SHA is on main"

      # A tag whose version npm already has publishes nothing: publish and verify are skipped. That
      # is a re-run of a release, or a version published before trusted publishing, when the
      # maintainers' script published with a token and pushed the tag afterwards (2.3.2 and
      # earlier). For such a tag this job still builds, tests and packs, PROVES the registry serves
      # exactly what this commit packs (the step after Pack), and FAILS unless the version carries
      # SLSA v1 provenance from this workflow at this tag, built from this commit (the step after
      # this one). So a green run always means a version with provenance. Before that check, 2.3.2's
      # tag ran green with publish and verify skipped, and 2.3.2 has no attestation. A tag whose
      # version is not on npm yet is published by the jobs below.
      - name: Is the version on npm yet
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$REGISTRY/$PACKAGE/$VERSION" || echo 000)"
          case "$CODE" in
            404) echo "$PACKAGE@$VERSION is free (404): this run publishes it"; echo "already=false" >> "$GITHUB_OUTPUT" ;;
            200) echo "::notice::$PACKAGE@$VERSION is already on npm: this run checks that the registry serves exactly what this commit packs, and publishes nothing"; echo "already=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::the registry answered $CODE for $PACKAGE/$VERSION, not a clear yes or no. Not proceeding on an unclear answer."; exit 1 ;;
          esac

      # Before the build: a version without provenance fails however well it builds.
      - name: An already-published version carries provenance from this workflow at this tag
        if: steps.registry.outputs.already == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/check-provenance.sh "$VERSION" "$GITHUB_SHA"

      # No dependency declares an install script; --ignore-scripts keeps it that way for the
      # release build even if one starts to.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          NAME="$(npm pack --silent --pack-destination "$RUNNER_TEMP/pack" | tail -1)"
          TARBALL="$RUNNER_TEMP/pack/$NAME"
          [ -f "$TARBALL" ] || { echo "::error::npm pack produced no tarball"; exit 1; }
          LIST="$(tar -tzf "$TARBALL")"
          for f in package/LICENSE package/README.md package/server.json package/package.json package/dist/index.js; do
            grep -qxF "$f" <<<"$LIST" || { echo "::error::$f is missing from the tarball"; exit 1; }
          done
          SHA1="$(sha1sum "$TARBALL" | cut -d' ' -f1)"
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          echo "$NAME  $(stat -c%s "$TARBALL") bytes  sha1=$SHA1  $INTEGRITY"
          {
            echo "name=$NAME"
            echo "path=$TARBALL"
            echo "sha1=$SHA1"
            echo "integrity=$INTEGRITY"
          } >> "$GITHUB_OUTPUT"

      - name: An already-published version is exactly what this commit packs
        if: steps.registry.outputs.already == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OURS: ${{ steps.pack.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/registry" "$RUNNER_TEMP/cmp/ours" "$RUNNER_TEMP/cmp/theirs"
          NAME="$(cd "$RUNNER_TEMP/registry" && npm pack --silent "$PACKAGE@$VERSION" | tail -1)"
          THEIRS="$RUNNER_TEMP/registry/$NAME"
          [ -f "$THEIRS" ] || { echo "::error::could not download $PACKAGE@$VERSION from the registry"; exit 1; }
          tar -xzf "$OURS" -C "$RUNNER_TEMP/cmp/ours"
          tar -xzf "$THEIRS" -C "$RUNNER_TEMP/cmp/theirs"
          # Contents, not tarball bytes: gzip output can differ between npm versions.
          if diff -r "$RUNNER_TEMP/cmp/ours/package" "$RUNNER_TEMP/cmp/theirs/package"; then
            echo "The registry's $PACKAGE@$VERSION is file-for-file what this commit packs."
          else
            echo "::error::the registry's $PACKAGE@$VERSION DIFFERS from what this commit packs. The published version's source is not this commit."
            exit 1
          fi

      - name: Unpack the tarball with its own dependencies
        id: unpack
        uses: ./.github/actions/unpack-tarball
        with:
          tarball: ${{ steps.pack.outputs.path }}

      - name: Test the packed tarball
        working-directory: ${{ steps.unpack.outputs.dir }}
        run: env -u NODE_PATH node --test test/*.test.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the tested tarball with provenance
    # check-bundle (#2815): a bundle that fails its checks stops the release before npm has the
    # immutable version, whose README links the bundle.
    needs: [build, check-bundle]
    if: needs.build.outputs.already != 'true'
    runs-on: ubuntu-latest # trusted publishing supports GitHub-hosted runners only
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a short-lived publish credential
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: The toolchain meets trusted publishing's minimums (Node 22.14.0, npm 11.5.1)
        run: |
          set -euo pipefail
          NPM_VERSION="$(npm --version)"
          echo "node $(node --version), npm $NPM_VERSION"
          # shellcheck disable=SC2016 # ${...} below is a JavaScript template literal
          node -e '
            const atLeast = (v, min) => { const a = v.split(".").map(Number), b = min.split(".").map(Number);
              for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i]; return true; };
            const bad = [];
            if (!atLeast(process.versions.node, "22.14.0")) bad.push(`node ${process.versions.node} < 22.14.0`);
            if (!atLeast(process.argv[1], "11.5.1")) bad.push(`npm ${process.argv[1]} < 11.5.1`);
            if (bad.length) { console.log(`::error::trusted publishing needs ${bad.join(" and ")}`); process.exit(1); }
          ' "$NPM_VERSION"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/release

      - name: The tarball is the one the build job tested
        env:
          NAME: ${{ needs.build.outputs.tarball }}
          WANT_SHA1: ${{ needs.build.outputs.sha1 }}
        run: |
          set -euo pipefail
          TARBALL="$RUNNER_TEMP/release/$NAME"
          [ -f "$TARBALL" ] || { echo "::error::no $NAME in the downloaded artifact"; ls -la "$RUNNER_TEMP/release"; exit 1; }
          GOT="$(sha1sum "$TARBALL" | cut -d' ' -f1)"
          [ "$GOT" = "$WANT_SHA1" ] || { echo "::error::downloaded tarball sha1 $GOT, tested $WANT_SHA1"; exit 1; }
          echo "$NAME sha1=$GOT, the tarball the build job tested"

      - name: The version is still not on npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$REGISTRY/$PACKAGE/$VERSION" || echo 000)"
          [ "$CODE" = 404 ] || { echo "::error::the registry answered $CODE for $PACKAGE/$VERSION, not 404. Not publishing."; exit 1; }

      # No NODE_AUTH_TOKEN: npm exchanges this job's GitHub OIDC token for a short-lived
      # credential scoped to this package. --provenance makes the publish FAIL, rather than
      # ship without an attestation, if provenance cannot be generated.
      - name: Publish
        working-directory: ${{ runner.temp }}/release
        env:
          NAME: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$NAME" --provenance --access public

  verify:
    name: Verify what the registry serves
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # For .github/scripts/check-provenance.sh only; nothing from the checkout is built or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      # The registry lags a publish: `npm publish` has printed success while the version
      # document answered 404 for about six minutes. Poll for up to 10 minutes, then check
      # the registry serves the tarball the build job tested, and says it has an attestation.
      # If this step fails, do NOT re-publish: the version may exist, and versions are immutable.
      - name: The registry serves the tested tarball with provenance
        env:
          VERSION: ${{ needs.build.outputs.version }}
          WANT_SHA1: ${{ needs.build.outputs.sha1 }}
          WANT_INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: |
          set -euo pipefail
          DOC=""
          for i in $(seq 1 60); do
            DOC="$(curl -sf --max-time 20 "$REGISTRY/$PACKAGE/$VERSION" || true)"
            if [ -n "$DOC" ] && [ "$(node -e 'try{process.stdout.write(String(JSON.parse(process.argv[1]).version||""))}catch{}' "$DOC")" = "$VERSION" ]; then
              echo "registry serves $PACKAGE@$VERSION (attempt $i of 60)"
              break
            fi
            DOC=""
            sleep 10
          done
          [ -n "$DOC" ] || { echo "::error::PUBLISH UNCONFIRMED after 10 min: the registry has not served $PACKAGE@$VERSION. Do NOT re-publish; check npm view first."; exit 1; }
          # shellcheck disable=SC2016 # ${...} below is a JavaScript template literal
          node -e '
            const d = JSON.parse(process.argv[1]);
            const [sha1, integrity] = process.argv.slice(2);
            const dist = d.dist || {};
            const bad = [];
            if (dist.shasum !== sha1) bad.push(`shasum ${dist.shasum}, tested ${sha1}`);
            if (dist.integrity !== integrity) bad.push(`integrity ${dist.integrity}, tested ${integrity}`);
            const pt = dist.attestations?.provenance?.predicateType;
            if (pt !== "https://slsa.dev/provenance/v1") bad.push(`provenance predicateType ${pt}, want https://slsa.dev/provenance/v1`);
            if (bad.length) { for (const b of bad) console.log(`::error::REGISTRY SERVES A DIFFERENT TARBALL OR NO PROVENANCE: ${b}`); process.exit(1); }
            console.log(`OK: shasum ${dist.shasum} and integrity match the tested tarball; provenance ${pt} at ${dist.attestations.url}`);
          ' "$DOC" "$WANT_SHA1" "$WANT_INTEGRITY"

      # What a user can run to check the package: install it and verify its registry signature
      # and provenance attestation. The packument can lag the version document, so the install
      # is retried.
      - name: npm audit signatures verifies the published package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          DIR="$(mktemp -d "$RUNNER_TEMP/audit.XXXXXX")"
          cd "$DIR"
          printf '{"name":"release-verify","private":true}\n' > package.json
          for i in $(seq 1 20); do
            if npm install --ignore-scripts --no-audit --no-fund "$PACKAGE@$VERSION"; then break; fi
            [ "$i" = 20 ] && { echo "::error::could not install $PACKAGE@$VERSION after 20 tries"; exit 1; }
            sleep 30
          done
          npm audit signatures
          npm audit signatures --json --include-attestations > audit.json
          # shellcheck disable=SC2016 # ${...} below is a JavaScript template literal
          node -e '
            const r = require(process.argv[1]); const [name, version] = process.argv.slice(2);
            if ((r.invalid || []).length || (r.missing || []).length) { console.log("::error::invalid or missing signatures: " + JSON.stringify({ invalid: r.invalid, missing: r.missing })); process.exit(1); }
            const v = (r.verified || []).find((x) => x.name === name && x.version === version);
            const pt = v?.attestations?.provenance?.predicateType;
            if (pt !== "https://slsa.dev/provenance/v1") { console.log(`::error::npm audit signatures did not verify a provenance attestation for ${name}@${version}`); process.exit(1); }
            console.log(`OK: npm audit signatures verified ${name}@${version}: registry signature and provenance attestation (${pt})`);
          ' "$DIR/audit.json" "$PACKAGE" "$VERSION"

      # The signature above says the attestation is genuine; this says what it attests: SLSA v1
      # provenance from this workflow at this tag, built from this commit, about the tarball npm
      # serves. After the audit step, whose install retries have outlasted the registry's lag.
      - name: The provenance names this workflow at this tag and this commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: bash .github/scripts/check-provenance.sh "$VERSION" "$GITHUB_SHA"

  # The Claude Desktop extension (#2815): a one-click install that needs no Node.js on the user's
  # machine, since Claude Desktop runs it with the Node.js it ships. Built from this tag, then
  # checked by check-bundle against the tarball the build job tested. This job runs dependency code
  # (npm ci, tsc, the MCPB CLI) and holds a read-only token; nothing it produces is trusted until
  # check-bundle, on another runner, has checked it.
  bundle:
    name: Build the Claude Desktop bundle (.mcpb)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.stage.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      # build.sh refuses a manifest.json not at package.json's version (and the build job checked
      # package.json against the tag), then runs `mcpb validate` on the manifest before `mcpb pack`:
      # an invalid manifest fails the release here, before anything is published, signed or attached.
      - name: Build the bundle; the pinned MCPB CLI validates the manifest, then packs
        run: bash listings/mcpb/build.sh "$RUNNER_TEMP/mcpb"

      - name: Stage the bundle and the release notes
        id: stage
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP/mcpb/echelongraph-mcp-$VERSION.mcpb" "$RUNNER_TEMP/release/echelongraph-mcp.mcpb"
          # Used only if the release does not exist yet: the version's CHANGELOG section.
          # shellcheck disable=SC2016 # ${...} below is a JavaScript template literal
          node -e '
            const fs = require("fs");
            const [file, v, out] = process.argv.slice(1);
            const lines = fs.readFileSync(file, "utf8").split("\n");
            const a = lines.findIndex((l) => l.startsWith(`## ${v} `));
            if (a < 0) { console.log(`::error::CHANGELOG.md has no "## ${v} " section`); process.exit(1); }
            let b = lines.findIndex((l, i) => i > a && l.startsWith("## "));
            if (b < 0) b = lines.length;
            const note = "Issue numbers (#NNNN) refer to EchelonGraph\u0027s internal issue tracker, which is not public: they are not issues of the public repository, and cannot be followed from it.";
            fs.writeFileSync(out, `${note}\n\n${lines.slice(a + 1, b).join("\n").trim()}\n`);
          ' CHANGELOG.md "$VERSION" "$RUNNER_TEMP/release/notes.md"
          SHA256="$(sha256sum "$RUNNER_TEMP/release/echelongraph-mcp.mcpb" | cut -d' ' -f1)"
          echo "echelongraph-mcp.mcpb  $(stat -c%s "$RUNNER_TEMP/release/echelongraph-mcp.mcpb") bytes  sha256=$SHA256"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb
          path: |
            ${{ runner.temp }}/release/echelongraph-mcp.mcpb
            ${{ runner.temp }}/release/notes.md
          if-no-files-found: error
          retention-days: 30

  # Checks the bundle on its own runner (#2815): the bundle job ran the MCPB CLI, from npm with
  # unpinned transitive dependencies, and that runner's files cannot be trusted to check its own
  # output. This job runs no npm package's code but check-bundle.mjs from a fresh checkout, the
  # bundle's own server (step 4 of check-bundle.mjs, after its files were compared), and an
  # `npm ci --ignore-scripts` of the lockfile's production packages as the reference. Read-only token.
  check-bundle:
    name: Check the bundle against the tested tarball
    needs: [build, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb
          path: ${{ runner.temp }}/mcpb

      - name: The tarball is the one the build job tested, and the bundle the one the bundle job built
        env:
          NAME: ${{ needs.build.outputs.tarball }}
          WANT_SHA1: ${{ needs.build.outputs.sha1 }}
          WANT_SHA256: ${{ needs.bundle.outputs.sha256 }}
        run: |
          set -euo pipefail
          TARBALL="$RUNNER_TEMP/tarball/$NAME"
          GOT="$(sha1sum "$TARBALL" | cut -d' ' -f1)"
          [ "$GOT" = "$WANT_SHA1" ] || { echo "::error::downloaded tarball sha1 $GOT, tested $WANT_SHA1"; exit 1; }
          GOT="$(sha256sum "$RUNNER_TEMP/mcpb/echelongraph-mcp.mcpb" | cut -d' ' -f1)"
          [ "$GOT" = "$WANT_SHA256" ] || { echo "::error::downloaded echelongraph-mcp.mcpb sha256 $GOT, built $WANT_SHA256"; exit 1; }
          mkdir -p "$RUNNER_TEMP/tested" "$RUNNER_TEMP/unpacked"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/tested"
          unzip -q "$RUNNER_TEMP/mcpb/echelongraph-mcp.mcpb" -d "$RUNNER_TEMP/unpacked"

      - name: The bundle is the tested package and serves manifest.json's tools
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nmref"
          cp package.json package-lock.json "$RUNNER_TEMP/nmref/"
          (cd "$RUNNER_TEMP/nmref" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
          env -u NODE_PATH node listings/mcpb/check-bundle.mjs "$RUNNER_TEMP/unpacked" \
            --version "$VERSION" --package "$RUNNER_TEMP/tested/package" \
            --node-modules-ref "$RUNNER_TEMP/nmref/node_modules"

  # Signs and attaches only once npm serves the version with provenance (verify), or for a version
  # npm already had (the build job then proved the registry serves what this commit packs, with
  # provenance from this workflow at this tag). A release that already carries the bundle keeps
  # it: a re-run never replaces a file users may have installed; it re-checks its attestation.
  # Each of the two assets is attached on its own, so a run that uploaded the bundle and failed
  # before its Sigstore bundle gets the Sigstore bundle on a re-run.
  # If this job fails after npm published, do NOT re-tag: re-run this run's failed jobs.
  release-bundle:
    name: Attest the bundle and attach it to the GitHub release
    needs: [build, verify, bundle, check-bundle]
    if: >-
      always() && needs.build.result == 'success' && needs.bundle.result == 'success' &&
      needs.check-bundle.result == 'success' &&
      (needs.verify.result == 'success' || (needs.build.outputs.already == 'true' && needs.verify.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # the OIDC token Sigstore exchanges for a short-lived signing certificate
      attestations: write # store the attestation with GitHub
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      ASSET: echelongraph-mcp.mcpb
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb
          path: ${{ runner.temp }}/release

      - name: The bundle is the one check-bundle checked
        env:
          WANT_SHA256: ${{ needs.bundle.outputs.sha256 }}
        run: |
          set -euo pipefail
          GOT="$(sha256sum "$RUNNER_TEMP/release/$ASSET" | cut -d' ' -f1)"
          [ "$GOT" = "$WANT_SHA256" ] || { echo "::error::downloaded $ASSET sha256 $GOT, checked $WANT_SHA256"; exit 1; }
          echo "$ASSET sha256=$GOT, the bundle check-bundle checked"

      - name: Sign the bundle with SLSA build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/echelongraph-mcp.mcpb

      - name: Attach the bundle to release vX.Y.Z
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            # A maintainer may create it by hand at the same moment: then this uploads to theirs.
            gh release create "$TAG" --verify-tag --title "echelongraph-mcp $VERSION" --notes-file "$RUNNER_TEMP/release/notes.md" \
              || gh release view "$TAG" --json tagName >/dev/null
          fi
          HAVE="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if grep -qxF "$ASSET" <<<"$HAVE"; then
            echo "::notice::release $TAG already carries $ASSET: kept, not replaced; the next step checks its attestation"
          else
            gh release upload "$TAG" "$RUNNER_TEMP/release/$ASSET"
          fi

      # What a user can run on the file they downloaded:
      #   gh attestation verify echelongraph-mcp.mcpb --repo echelongraph/echelongraph-mcp \
      #     --signer-workflow echelongraph/echelongraph-mcp/.github/workflows/release.yml --source-ref refs/tags/vX.Y.Z
      - name: The bundle the release serves is attested by this workflow at this tag
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/served"
          gh release download "$TAG" --pattern "$ASSET" --dir "$RUNNER_TEMP/served"
          gh attestation verify "$RUNNER_TEMP/served/$ASSET" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" --source-ref "refs/tags/$TAG" \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/verified.json"
          echo "OK: release $TAG serves $ASSET (sha256 $(sha256sum "$RUNNER_TEMP/served/$ASSET" | cut -d' ' -f1)), attested by this workflow at refs/tags/$TAG"

      # Its own upload, apart from the bundle's: a re-run of a run that attached the bundle and
      # failed before this file attaches it now. When the served bundle is the one this run signed,
      # this run's Sigstore bundle is its signature; when it is an earlier run's file, the Sigstore
      # bundle is the attestation the step above verified for that file.
      - name: Attach the bundle's Sigstore bundle to release vX.Y.Z
        env:
          SIGSTORE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          SIG="$ASSET.sigstore.json"
          HAVE="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if grep -qxF "$SIG" <<<"$HAVE"; then
            echo "::notice::release $TAG already carries $SIG: kept, not replaced"
            exit 0
          fi
          OURS="$(sha256sum "$RUNNER_TEMP/release/$ASSET" | cut -d' ' -f1)"
          SERVED="$(sha256sum "$RUNNER_TEMP/served/$ASSET" | cut -d' ' -f1)"
          if [ "$SERVED" = "$OURS" ]; then
            cp "$SIGSTORE" "$RUNNER_TEMP/release/$SIG"
          else
            jq -e '.[0].attestation.bundle' "$RUNNER_TEMP/verified.json" > "$RUNNER_TEMP/release/$SIG" || {
              echo "::error::release $TAG serves an earlier run's $ASSET (sha256 $SERVED) and gh attestation verify returned no Sigstore bundle for it"; exit 1; }
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/release/$SIG"
