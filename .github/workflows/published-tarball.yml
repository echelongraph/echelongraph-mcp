name: Published tarball

# Runs this repository's test suite against what npm actually serves as
# echelongraph-mcp@latest, installed with only its own dependencies, the way `npx` installs it.
# A published build once diverged from its source for months because nothing tested the
# artifact users receive. Daily, this catches that divergence, and a new release of a
# dependency (resolved fresh from the package's ranges) that breaks the published package.
#
# The suite comes from the checked-out ref (main, on the schedule), not from the release's tag.
# So a test added on main for a change not yet released fails this job until that release
# ships: that is the divergence it exists to report.
#
# On failure it opens an issue titled "Published echelongraph-mcp@latest fails its own test
# suite", or comments on the open one. On a green real run it closes any open one, citing that
# run, so an alert never outlives its cause and the next failure opens a fresh issue rather than
# a comment on a stale one. (Before this, #2 stayed open, telling every visitor that `latest`
# failed its tests, for a day after a green run had disproved it.)
#
# Control: run it by hand with `control: true`. The run blanks the Shodan ownership sentence
# in the unpacked dist/index.js, so the suite MUST fail and the issue MUST be opened or
# commented on, marked as a control. A control run whose suite passes fails loudly: this job
# would then be unable to see a broken release. A control that cannot find the sentence to
# blank fails without alerting: a broken control proves nothing.
#
# A second job, `provenance`, checks daily that latest carries SLSA v1 provenance from
# release.yml at refs/tags/v<latest>, with its own alert issue and its own control; see it below.
#
# GitHub disables scheduled workflows in a public repository after 60 days without activity
# in it; re-enable this one from the Actions tab if that happens.

on:
  schedule:
    # Daily at 23:07 UTC, which is 08:07 KST: the maintainers are in Korea, so a result (or an
    # alert) is waiting at the start of their day. Not :00, because GitHub delays schedules at the
    # top of the hour under load; the first scheduled run of this workflow, due 06:23 UTC,
    # started at 14:13 UTC.
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      control:
        description: "Control run: corrupt the unpacked package so the suite must fail and the alert must fire"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: published-tarball
  cancel-in-progress: false

env:
  PACKAGE: echelongraph-mcp
  CONTROL: ${{ github.event_name == 'workflow_dispatch' && inputs.control && 'true' || 'false' }}
  ISSUE_TITLE: Published echelongraph-mcp@latest fails its own test suite

jobs:
  published-tarball:
    name: Test echelongraph-mcp@latest as npm serves it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*" # what a user installing Node today gets
          package-manager-cache: false

      - name: Pack echelongraph-mcp@latest from the registry
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          cd "$RUNNER_TEMP/pack"
          NAME="$(npm pack "$PACKAGE@latest" --silent | tail -1)"
          TARBALL="$RUNNER_TEMP/pack/$NAME"
          [ -f "$TARBALL" ] || { echo "::error::npm pack $PACKAGE@latest produced no tarball"; exit 1; }
          VERSION="$(tar -xzOf "$TARBALL" package/package.json | node -e 'let r="";process.stdin.on("data",(d)=>r+=d).on("end",()=>process.stdout.write(JSON.parse(r).version))')"
          echo "$PACKAGE@latest is $VERSION: $NAME  $(stat -c%s "$TARBALL") bytes  sha1=$(sha1sum "$TARBALL" | cut -d' ' -f1)"
          {
            echo "path=$TARBALL"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Unpack it with its own dependencies
        id: unpack
        uses: ./.github/actions/unpack-tarball
        with:
          tarball: ${{ steps.pack.outputs.path }}

      - name: "Control: blank the Shodan ownership sentence in dist/index.js"
        id: control
        if: env.CONTROL == 'true'
        working-directory: ${{ steps.unpack.outputs.dir }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # ${...} below is a JavaScript template literal
          node -e '
            const fs = require("fs");
            const f = "dist/index.js";
            const sentence = "Shodan data is owned by Shodan, which holds its copyright (© Shodan).";
            const src = fs.readFileSync(f, "utf8");
            const before = src.split(sentence).length - 1;
            if (before === 0) { console.log(`::error::BROKEN CONTROL: the sentence is not in ${f}, so there is nothing to corrupt and a failure would prove nothing.`); process.exit(1); }
            fs.writeFileSync(f, src.split(sentence).join(""));
            const after = fs.readFileSync(f, "utf8").split(sentence).length - 1;
            if (after !== 0) { console.log(`::error::BROKEN CONTROL: ${after} copies remain after blanking.`); process.exit(1); }
            console.log(`CONTROL: blanked ${before} copy of the Shodan ownership sentence in ${f}. The suite must now fail.`);
          '

      - name: Run the test suite against the published package
        id: test
        working-directory: ${{ steps.unpack.outputs.dir }}
        run: env -u NODE_PATH node --test test/*.test.mjs

      # A real run alerts on any failure: a package users cannot pack, install or pass its own
      # suite with is broken for them too. A control alerts only when the suite itself failed.
      - name: Open or comment on the alert issue
        if: failure() && (env.CONTROL != 'true' || steps.test.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.pack.outputs.version }}
          PACK: ${{ steps.pack.outcome }}
          UNPACK: ${{ steps.unpack.outcome }}
          TEST: ${{ steps.test.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/alert.md"
          {
            if [ "$CONTROL" = true ]; then
              echo "**CONTROL RUN. Not a real failure.** This run deliberately blanked the Shodan ownership sentence in the unpacked \`dist/index.js\` to prove this alert fires. Close this issue if it has no other comments."
              echo
            fi
            echo "This run's test of the package npm serves as \`$PACKAGE@latest\` failed."
            echo
            echo "- Version tested: \`${VERSION:-unknown}\`"
            echo "- Test suite from: \`$GITHUB_SHA\` ($GITHUB_REF_NAME)"
            echo "- Pack from the registry: $PACK"
            echo "- Unpack and install its dependencies: $UNPACK"
            echo "- Test suite: ${TEST:-skipped}"
            echo "- Run: $RUN_URL"
          } > "$BODY"
          # Match the exact title among open issues. Not the search API: its index lags a
          # just-opened issue, and a second alert would open a duplicate.
          NUMBER="$(gh issue list --state open --limit 1000 --json number,title \
            | node -e 'let r="";process.stdin.on("data",(d)=>r+=d).on("end",()=>{const m=JSON.parse(r).filter((i)=>i.title===process.env.ISSUE_TITLE).sort((a,b)=>a.number-b.number)[0];process.stdout.write(m?String(m.number):"")})')"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file "$BODY"
            echo "commented on #$NUMBER"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$BODY"
          fi

      # A green REAL run closes the alert: the package npm serves passes its own suite now,
      # so an open alert is false. Never on a control run (its suite is corrupted on purpose,
      # so it cannot reach here green; the condition says so anyway). The alert is matched by
      # its exact title among open issues, as the step above matches it.
      - name: Close the alert issue after a green run
        if: success() && env.CONTROL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.pack.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NUMBERS="$(gh issue list --state open --limit 1000 --json number,title \
            | node -e 'let r="";process.stdin.on("data",(d)=>r+=d).on("end",()=>{process.stdout.write(JSON.parse(r).filter((i)=>i.title===process.env.ISSUE_TITLE).map((i)=>i.number).join(" "))})')"
          if [ -z "$NUMBERS" ]; then
            echo "no open alert issue; nothing to close"
            exit 0
          fi
          for N in $NUMBERS; do
            gh issue close "$N" --comment "This run tested the package npm serves as \`$PACKAGE@latest\` (\`$VERSION\`) with the suite from \`$GITHUB_SHA\` ($GITHUB_REF_NAME), and it passed: $RUN_URL. Closing: the failure this issue reported no longer reproduces. A later failure opens a new issue."
            echo "closed #$N"
          done

      - name: "Control: the suite must have failed"
        if: always() && env.CONTROL == 'true' && steps.test.outcome == 'success'
        run: |
          echo "::error::CONTROL FAILED: the suite PASSED against a package with the Shodan ownership sentence blanked. This job cannot detect a broken release."
          exit 1

  # npm's latest must carry SLSA v1 provenance from release.yml at refs/tags/v<latest>, built from
  # the commit that tag points at today (.github/scripts/check-provenance.sh). A green Release run
  # is not proof of that: a version published outside release.yml (2.3.2 and earlier were, by the
  # maintainers' script with a token) runs its tag's Release green with publish and verify skipped.
  # An attestation naming refs/tags/v<latest> also proves the tag existed when latest was published.
  #
  # It has its own alert issue, so a missing attestation is never reported as a failing test suite,
  # and a green run closes only its own alert. Independent of the job above: each reports on its own.
  #
  # Control: with `control: true` it checks 2.3.2 instead of latest. 2.3.2 was published with a
  # token and can never gain an attestation (npm attaches them at publish), so the check MUST fail
  # and the alert MUST fire, marked as a control. A control whose check passes fails loudly.
  provenance:
    name: echelongraph-mcp@latest carries provenance from release.yml at its tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # This job's alert. It replaces the workflow-level title for this job only.
      ISSUE_TITLE: Published echelongraph-mcp@latest has no provenance from release.yml at its tag
      CONTROL_VERSION: "2.3.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: The version to check, and the commit its tag points at
        id: target
        run: |
          set -euo pipefail
          if [ "$CONTROL" = true ]; then
            VERSION="$CONTROL_VERSION"
            echo "CONTROL: checking $PACKAGE@$VERSION, which has no attestation. The check must fail."
          else
            VERSION="$(npm view "$PACKAGE" dist-tags.latest --prefer-online)"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the version to check is '$VERSION', not MAJOR.MINOR.PATCH"; exit 1; }
          # The tag as this repository serves it now; the checkout above is main, without tags.
          # An annotated tag lists its commit on the peeled ^{} line, a lightweight one directly.
          COMMIT="$(git ls-remote origin "refs/tags/v$VERSION^{}" | cut -f1)"
          [ -n "$COMMIT" ] || COMMIT="$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)"
          [ -n "$COMMIT" ] || { echo "::error::this repository has no tag v$VERSION, so the source $PACKAGE@$VERSION was published from is not public"; exit 1; }
          echo "$PACKAGE@$VERSION; tag v$VERSION is commit $COMMIT"
          {
            echo "version=$VERSION"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: SLSA v1 provenance from release.yml at the tag, built from that commit
        id: check
        env:
          VERSION: ${{ steps.target.outputs.version }}
          COMMIT: ${{ steps.target.outputs.commit }}
        run: bash .github/scripts/check-provenance.sh "$VERSION" "$COMMIT"

      # A real run alerts on any failure: a latest with no provenance, or none that can be read,
      # is one users cannot trace to this repository. A control alerts only when the check failed.
      - name: Open or comment on the provenance alert issue
        if: failure() && (env.CONTROL != 'true' || steps.check.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.target.outputs.version }}
          COMMIT: ${{ steps.target.outputs.commit }}
          TARGET: ${{ steps.target.outcome }}
          CHECK: ${{ steps.check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/alert.md"
          {
            if [ "$CONTROL" = true ]; then
              echo "**CONTROL RUN. Not a real failure.** This run checked \`$PACKAGE@$CONTROL_VERSION\`, which was published without provenance, to prove this alert fires. Close this issue if it has no other comments."
              echo
            fi
            echo "This run could not confirm that \`$PACKAGE@${VERSION:-latest}\` carries SLSA v1 provenance from \`.github/workflows/release.yml\` at \`refs/tags/v${VERSION:-?}\`."
            echo
            echo "- Version checked: \`${VERSION:-unknown}\`"
            echo "- Tag's commit: \`${COMMIT:-unknown}\`"
            echo "- Find the version and its tag: $TARGET"
            echo "- Provenance check: ${CHECK:-skipped}"
            echo "- Run: $RUN_URL"
            echo
            echo "An attestation is attached when a version is published and cannot be added later. If the check says the version has none, it was not published by release.yml; the way out is a new version released through release.yml."
          } > "$BODY"
          # Matched by exact title among open issues, as the test suite's alert is.
          NUMBER="$(gh issue list --state open --limit 1000 --json number,title \
            | node -e 'let r="";process.stdin.on("data",(d)=>r+=d).on("end",()=>{const m=JSON.parse(r).filter((i)=>i.title===process.env.ISSUE_TITLE).sort((a,b)=>a.number-b.number)[0];process.stdout.write(m?String(m.number):"")})')"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file "$BODY"
            echo "commented on #$NUMBER"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$BODY"
          fi

      - name: Close the provenance alert issue after a green run
        if: success() && env.CONTROL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.target.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NUMBERS="$(gh issue list --state open --limit 1000 --json number,title \
            | node -e 'let r="";process.stdin.on("data",(d)=>r+=d).on("end",()=>{process.stdout.write(JSON.parse(r).filter((i)=>i.title===process.env.ISSUE_TITLE).map((i)=>i.number).join(" "))})')"
          if [ -z "$NUMBERS" ]; then
            echo "no open provenance alert; nothing to close"
            exit 0
          fi
          for N in $NUMBERS; do
            gh issue close "$N" --comment "This run found that \`$PACKAGE@latest\` (\`$VERSION\`) carries SLSA v1 provenance from \`.github/workflows/release.yml\` at \`refs/tags/v$VERSION\`: $RUN_URL. Closing: the failure this issue reported no longer reproduces. A later failure opens a new issue."
            echo "closed #$N"
          done

      - name: "Control: the provenance check must have failed"
        if: always() && env.CONTROL == 'true' && steps.check.outcome == 'success'
        run: |
          echo "::error::CONTROL FAILED: the provenance check PASSED for $PACKAGE@$CONTROL_VERSION, which was published without provenance. This job cannot detect a latest without provenance."
          exit 1
